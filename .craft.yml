minVersion: 3.9.0
changelog:
  policy: none
preReleaseCommand: bash scripts/craft-pre-release.sh
versioning:
  policy: manual
targets:
  - name: npm
    id: "@sentry/starlight-theme"
    access: public
    includeNames: /^sentry-starlight-theme-\d.*\.tgz$/
  - name: github
    tagPrefix: v
    includeNames: /^$/
